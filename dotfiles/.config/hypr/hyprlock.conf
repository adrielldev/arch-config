background {
    monitor =
    color = rgba(25, 20, 20, 1.0)
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_fade_time = 200 # Milliseconds until a dot fades out
    fade_on_empty = false
    placeholder_text = <i>Digite a senha...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
